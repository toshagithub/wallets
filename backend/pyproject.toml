[project]
name = "wallets-backend"
version = "0.1.0"
description = "Backend servis za upravljanje i distribuciju digitalnih ulaznica."
readme = "README.md"
requires-python = ">=3.14,<3.15"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "cryptography>=46.0.0",
    "email-validator>=2.3.0",
    "fastapi",
    "google-api-python-client>=2.201.0",
    "google-auth>=2.62.0",
    "jsonschema>=4.23,<5",
    "openpyxl>=3.1.5",
    "psycopg[binary]>=3.3.6",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "structlog>=26.1.0",
    "uvicorn[standard]",
]

[build-system]
requires = ["uv_build>=0.12.19,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = "src"

[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
